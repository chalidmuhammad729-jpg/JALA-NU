    function formatWaLink(phone, namaSantri, status, komplek) {
      const clean = String(phone || '').replace(/\D/g, '');
      const normalized = clean.startsWith('0')
        ? `62${clean.slice(1)}`
        : clean.startsWith('62')
          ? clean
          : `62${clean}`;

      const text = `Assalamu'alaikum Wr. Wb. Yth. Wali Santri dari *${namaSantri}*. Kami dari tim pendaftaran & informasi *JALA NU — Pondok Pesantren Nurul Ulum Bantul* ingin menginformasikan progres terkini (Status: *${status}*, Penempatan: *${komplek}*). Apakah ada informasi atau jadwal kunjungan/daftar ulang yang dapat kami bantu? Terima kasih.`;

      return `https://wa.me/${normalized}?text=${encodeURIComponent(text)}`;
    }

    function exportToCsv(filename, rows) {
      if (!rows.length) return;
      const headers = Object.keys(rows[0]);
      const csvContent = [
        headers.join(','),
        ...rows.map((row) =>
          headers
            .map((field) => {
              const val = row[field] ?? '';
              const escaped = String(val).replace(/"/g, '""');
              return `"${escaped}"`;
            })
            .join(',')
        ),
      ].join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

                                  santri.waliWa,
                                  santri.nama,
                                  santri.status,
                                  santri.komplek
                                )}
                                target="_blank"
                                rel="noreferrer"
                                className="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition"
                              >
                                Follow-Up WA
                              </a>
                              <button
                                type="button"
                                onClick={() => handleDeleteSantri(santri.id)}
                                className="px-2.5 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-semibold transition"
                              >
                                Hapus
                              </button>
                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'laporan' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="bg-white rounded-2xl p-5 sm:p-6 border border-[#D8E6F3] shadow-sm h-fit">
                  <h2 className="text-base sm:text-lg font-extrabold text-[#07172C] mb-4">
                    Input Laporan Unit / Komplek
                  </h2>

                  <form onSubmit={handleAddLaporan} className="space-y-3.5">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">
                        Entitas Kepengurusan / Komplek *
                      </label>
                      <select
                        value={formLaporan.entitas}
                        onChange={(e) =>
                          setFormLaporan({ ...formLaporan, entitas: e.target.value })
                        }
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white font-semibold focus:outline-none focus:ring-2 focus:ring-[#0284C7]"
                      >
                        {ENTITAS_RESMI.map((ent) => (
                          <option key={ent} value={ent}>
                            {ent}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">
                          Periode Laporan
                        </label>
                        <select
                          value={formLaporan.periode}
                          onChange={(e) =>
                            setFormLaporan({ ...formLaporan, periode: e.target.value })
                          }
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#0284C7]"
                        >
                          {PERIODE_LAPORAN.map((p) => (
                            <option key={p} value={p}>
                              {p}
                            </option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">
                          Tanggal Laporan
                        </label>
                        <input
                          type="date"
                          value={formLaporan.tanggal}
                          onChange={(e) =>
                            setFormLaporan({ ...formLaporan, tanggal: e.target.value })
                          }
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#0284C7]"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">
                        Judul / Topik Utama Laporan *
                      </label>
                      <input
                        type="text"
                        required
                        value={formLaporan.judul}
                        onChange={(e) =>
                          setFormLaporan({ ...formLaporan, judul: e.target.value })
                        }
                        placeholder="Contoh: Rekap Absensi, Kegiatan & Kesiapan Santri Baru"
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#0284C7]"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">
                          Jumlah Hadir
                        </label>
                        <input
                          type="number"
                          min="0"
                          value={formLaporan.hadir}
                          onChange={(e) =>
                            setFormLaporan({ ...formLaporan, hadir: e.target.value })
                          }
                          placeholder="0"
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#0284C7]"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">
                          Izin / Sakit
                        </label>
                        <input
                          type="number"
                          min="0"
                          value={formLaporan.izinSakit}
                          onChange={(e) =>
                            setFormLaporan({ ...formLaporan, izinSakit: e.target.value })
                          }
                          placeholder="0"
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#0284C7]"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">
                        Ringkasan Kegiatan Terlaksana
                      </label>
                      <textarea
                        rows={2}
                        value={formLaporan.kegiatan}
                        onChange={(e) =>
                          setFormLaporan({ ...formLaporan, kegiatan: e.target.value })
                        }
                        placeholder="Uraikan program atau kegiatan utama yang telah berjalan..."
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#0284C7]"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">
                        Kendala / Catatan Lapangan
                      </label>
                      <input
                        type="text"
                        value={formLaporan.kendala}
                        onChange={(e) =>
                          setFormLaporan({ ...formLaporan, kendala: e.target.value })
                        }
                        placeholder="Hambatan atau hal yang perlu perhatian..."
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#0284C7]"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">
                        Rencana Tindak Lanjut
                      </label>
                      <input
                        type="text"
                        value={formLaporan.tindakLanjut}
                        onChange={(e) =>
                          setFormLaporan({ ...formLaporan, tindakLanjut: e.target.value })
                        }
                        placeholder="Langkah perbaikan atau target berikutnya..."
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#0284C7]"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2.5 rounded-xl bg-gradient-to-r from-[#0F294A] to-[#0284C7] hover:opacity-95 text-white font-bold text-sm shadow transition"
                    >
                      + Kirim Laporan ke JALA NU
                    </button>
                  </form>
                </div>

                <div className="lg:col-span-2 bg-white rounded-2xl p-5 sm:p-6 border border-[#D8E6F3] shadow-sm space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                    <div>
                      <h2 className="text-base sm:text-lg font-extrabold text-[#07172C]">
                        Arsip & Verifikasi Laporan ({filteredLaporan.length})
                      </h2>
                      <p className="text-xs text-slate-500">
                        Filter aktif: <strong>{activeEntitasFilter}</strong> • Dewan Pengawas dapat memverifikasi atau memberi catatan revisi
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => exportToCsv('jala-nu-laporan-7-entitas.csv', filteredLaporan)}
                      className="px-3.5 py-2 rounded-xl bg-sky-50 hover:bg-sky-100 text-[#0284C7] border border-sky-200 text-xs font-bold self-start transition"
                    >
                      Ekspor CSV
                    </button>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input
                      type="text"
                      value={searchLaporan}
                      onChange={(e) => setSearchLaporan(e.target.value)}
                      placeholder="Cari topik, kegiatan, entitas..."
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-[#0284C7]"
                    />
                    <select
                      value={filterPeriode}
                      onChange={(e) => setFilterPeriode(e.target.value)}
                      className="px-3 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#0284C7]"
                    >
                      <option value="Semua">Semua Periode</option>
                      {PERIODE_LAPORAN.map((p) => (
                        <option key={p} value={p}>
                          {p}
                        </option>
                      ))}
                    </select>
                    <select
                      value={filterVerif}
                      onChange={(e) => setFilterVerif(e.target.value)}
                      className="px-3 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#0284C7]"
                    >
                      <option value="Semua">Semua Status Verifikasi</option>
                      {STATUS_VERIFIKASI.map((v) => (
                        <option key={v} value={v}>
                          {v}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="space-y-3.5">
                    {filteredLaporan.length === 0 ? (
                      <div className="p-8 text-center rounded-xl border border-dashed border-slate-300 text-sm text-slate-500">
                        Belum ada laporan yang sesuai dengan filter ini.
                      </div>
                    ) : (
                      filteredLaporan.map((lap) => (
                        <div
                          key={lap.id}
                          className="p-4 rounded-xl bg-[#F9FCFF] border border-[#DCE8F5] space-y-2.5"
                        >
                          <div className="flex flex-wrap items-center justify-between gap-2">
                            <div className="flex items-center gap-2 flex-wrap">
                              <span className="px-2.5 py-0.5 rounded-lg bg-[#0F294A] text-white text-xs font-bold">
                                {lap.entitas}
                              </span>
                              <span className="px-2 py-0.5 rounded-md bg-sky-100 text-sky-800 text-xs font-semibold">
                                {lap.periode}
                              </span>
                              <span className="text-xs text-slate-500">
                                {lap.tanggal} ({lap.id})
                              </span>
                            </div>
                            <span
                              className={`px-2.5 py-0.5 rounded-full text-xs font-bold border ${getVerifBadgeClass(
                                lap.statusVerifikasi
                              )}`}
                            >
                              {lap.statusVerifikasi}
                            </span>
                          </div>

                          <h3 className="text-sm sm:text-base font-extrabold text-[#07172C]">
                            {lap.judul}
                          </h3>

                          <div className="flex flex-wrap gap-3 text-xs font-semibold text-slate-700">
                            <span>Hadir: <strong className="text-emerald-700">{lap.hadir}</strong></span>
                            <span>Izin/Sakit: <strong className="text-amber-700">{lap.izinSakit}</strong></span>
                          </div>

                          <p className="text-xs text-slate-700">
                            <strong>Kegiatan:</strong> {lap.kegiatan}
                          </p>
                          <p className="text-xs text-slate-700">
                            <strong>Kendala:</strong> {lap.kendala} • <strong>Tindak Lanjut:</strong> {lap.tindakLanjut}
                          </p>

                          {lap.evaluasiPengawas && (
                            <div className="p-2.5 rounded-lg bg-emerald-50/80 border border-emerald-200 text-xs text-emerald-900">
                              <strong>Catatan Dewan Pengawas:</strong> {lap.evaluasiPengawas}
                            </div>
                          )}

                          <div className="pt-2 border-t border-slate-200/80 flex flex-col sm:flex-row sm:items-center gap-2">
                            <select
                              value={lap.statusVerifikasi}
                              onChange={(e) =>
                                handleUpdateVerif(lap.id, e.target.value)
                              }
                              className="px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white text-xs font-bold text-[#07172C]"
                            >
                              {STATUS_VERIFIKASI.map((v) => (
                                <option key={v} value={v}>
                                  {v}
                                </option>
                              ))}
                            </select>

                            <input
                              type="text"
                              value={lap.evaluasiPengawas || ''}
                              onChange={(e) =>
                                handleUpdateVerif(
                                  lap.id,
                                  lap.statusVerifikasi,
                                  e.target.value
                                )
                              }
                              placeholder="Tulis catatan evaluasi Dewan Pengawas..."
                              className="flex-1 px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-xs focus:outline-none focus:ring-2 focus:ring-[#0284C7]"
                            />
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'rekap' && (
              <div className="bg-white rounded-2xl p-6 sm:p-8 border border-[#D8E6F3] shadow-sm space-y-6">
                <div className="no-print flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pb-4 border-b border-slate-200">
                  <div>
                    <h2 className="text-lg font-extrabold text-[#07172C]">
                      Rekapitulasi Resmi & Siap Cetak Rapat Pimpinan
                    </h2>
                    <p className="text-xs text-slate-500">
                      Ringkasan data pendaftaran santri dan laporan 7 entitas Pondok Pesantren Nurul Ulum Bantul
                    </p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => exportToCsv('jala-nu-rekap-laporan.csv', laporanList)}
                      className="px-3.5 py-2 rounded-xl bg-sky-50 hover:bg-sky-100 text-[#0284C7] border border-sky-200 text-xs font-bold"
                    >
                      Unduh CSV
                    </button>
                    <button
                      type="button"
                      onClick={() => window.print()}
                      className="px-4 py-2 rounded-xl bg-[#0F294A] hover:bg-[#07172C] text-white text-xs font-bold shadow"
                    >
                      Cetak Laporan
                    </button>
                  </div>
                </div>

                <div className="text-center border-b-2 border-[#07172C] pb-4 space-y-1">
                  <p className="text-xs font-bold uppercase tracking-widest text-[#0284C7]">
                    SISTEM JALA NU • JARINGAN ADMINISTRASI, LAPORAN & ASPIRASI
                  </p>
                  <h3 className="text-xl font-extrabold text-[#07172C] uppercase">
                    PONDOK PESANTREN NURUL ULUM BANTUL
                  </h3>
                  <p className="text-xs text-slate-600">
                    Rekapitulasi Progres Pendaftaran Santri & Laporan 7 Entitas (Dewan Pengawas, Ustadz Ustadzah, OSIM, Komplek Mbah Zainuri, Komplek Mbah Achmadi, Komplek Mbah Romlah, Komplek Mbah Wasirah)
                  </p>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                  <div className="p-3.5 rounded-xl bg-[#F2F7FC] border border-[#DCE8F5]">
                    <p className="text-[11px] font-bold text-slate-500 uppercase">Pipeline PPDB</p>
                    <p className="text-2xl font-extrabold text-[#07172C]">{stats.totalPipeline}</p>
                  </div>
                  <div className="p-3.5 rounded-xl bg-[#F2F7FC] border border-[#DCE8F5]">
                    <p className="text-[11px] font-bold text-slate-500 uppercase">Santri Aktif</p>
                    <p className="text-2xl font-extrabold text-[#0284C7]">{stats.santriAktif}</p>
                  </div>
                  <div className="p-3.5 rounded-xl bg-[#F2F7FC] border border-[#DCE8F5]">
                    <p className="text-[11px] font-bold text-slate-500 uppercase">Kepatuhan Unit</p>
                    <p className="text-2xl font-extrabold text-emerald-700">{stats.kepatuhanPersen}%</p>
                  </div>
                  <div className="p-3.5 rounded-xl bg-[#F2F7FC] border border-[#DCE8F5]">
                    <p className="text-[11px] font-bold text-slate-500 uppercase">Terverifikasi</p>
                    <p className="text-2xl font-extrabold text-[#0F294A]">{stats.laporanTerverifikasi}</p>
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr className="bg-[#0F294A] text-white">
                        <th className="p-2.5 rounded-tl-lg">Entitas</th>
                        <th className="p-2.5">Periode</th>
                        <th className="p-2.5">Tanggal</th>
                        <th className="p-2.5">Topik Laporan</th>
                        <th className="p-2.5">Hadir / Izin</th>
                        <th className="p-2.5 rounded-tr-lg">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200">
                      {laporanList.map((lap) => (
                        <tr key={lap.id} className="hover:bg-sky-50/40">
                          <td className="p-2.5 font-bold text-[#07172C]">{lap.entitas}</td>
                          <td className="p-2.5">{lap.periode}</td>
                          <td className="p-2.5">{lap.tanggal}</td>
                          <td className="p-2.5">{lap.judul}</td>
                          <td className="p-2.5">
                            {lap.hadir} / {lap.izinSakit}
                          </td>
                          <td className="p-2.5 font-semibold">{lap.statusVerifikasi}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 pt-6 text-center text-xs">
                  <div className="space-y-12">
                    <p className="font-bold text-[#07172C]">Dewan Pengawas</p>
                    <p className="border-t border-slate-400 pt-1 text-slate-600">
                      ( ______________________ )
                    </p>
                  </div>
                  <div className="space-y-12">
                    <p className="font-bold text-[#07172C]">Koordinator / Pimpinan</p>
                    <p className="border-t border-slate-400 pt-1 text-slate-600">
                      ( ______________________ )
                    </p>
                  </div>
                  <div className="space-y-12">
                    <p className="font-bold text-[#07172C]">Marketing & Administrasi JALA NU</p>
                    <p className="border-t border-slate-400 pt-1 text-slate-600">
                      Muhammad Idham Chalid
                    </p>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
